services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      retries: 10
  api:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]
volumes:
  pgdata:
